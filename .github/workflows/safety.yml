name: Safety Evals

on:
  workflow_call:
    inputs:
      run_compose_validate:
        description: "Run compose file validation"
        type: boolean
        default: false
      runner:
        description: 'Runner label (e.g., ubuntu-latest or self-hosted)'
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      PLATFORM_TOKEN:
        required: true
      OPENBRAIN_KEY:
        required: false
      SEMGREP_APP_TOKEN:
        required: false
    # Note: OPENBRAIN_URL is accessed via vars.OPENBRAIN_URL in job steps.
    # workflow_call does not support a vars: block — variables pass through automatically.

jobs:
  resolve-platform:
    name: Resolve Platform SHA
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    outputs:
      platform_sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Get platform HEAD SHA
        id: sha
        env:
          PLATFORM_TOKEN: ${{ secrets.PLATFORM_TOKEN }}
        run: |
          set -euo pipefail
          # Token goes via git config env vars (not argv, not the URL).
          AUTH=$(printf 'x-access-token:%s' "$PLATFORM_TOKEN" | base64 | tr -d '\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: basic $AUTH"
          SHA=$(git ls-remote https://github.com/AlbertvD/homelab-platform.git HEAD | cut -f1)
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Failed to resolve homelab-platform HEAD SHA"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  destructive-check:
    name: Destructive Op Check
    needs: resolve-platform
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Always checked out at the resolved SHA, never restored from actions/cache:
      # a cache entry could be poisoned by PR code and its scripts run with secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AlbertvD/homelab-platform
          ref: ${{ needs.resolve-platform.outputs.platform_sha }}
          path: .platform
          token: ${{ secrets.PLATFORM_TOKEN }}
          persist-credentials: false
      - name: Run destructive operation check
        run: bash .platform/evals/destructive-op-check.sh

  compose-validate:
    name: Compose Validate
    if: ${{ inputs.run_compose_validate }}
    needs: resolve-platform
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Always checked out at the resolved SHA, never restored from actions/cache:
      # a cache entry could be poisoned by PR code and its scripts run with secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AlbertvD/homelab-platform
          ref: ${{ needs.resolve-platform.outputs.platform_sha }}
          path: .platform
          token: ${{ secrets.PLATFORM_TOKEN }}
          persist-credentials: false
      - name: Run compose validation
        run: bash .platform/evals/compose-validate.sh

  gitleaks:
    name: Secret Detection
    # Pinned to a SHA (not the movable v1 tag); bump when gitleaks.yml changes.
    uses: AlbertvD/homelab-platform/.github/workflows/gitleaks.yml@cf5f7735eb3512ed2dec00eb45c33fca91131542 # v1
    with:
      runner: ${{ inputs.runner }}

  semgrep:
    name: SAST
    # Pinned to a SHA (not the movable v1 tag); bump when semgrep.yml changes.
    uses: AlbertvD/homelab-platform/.github/workflows/semgrep.yml@cf5f7735eb3512ed2dec00eb45c33fca91131542 # v1
    with:
      runner: ${{ inputs.runner }}
    secrets:
      PLATFORM_TOKEN: ${{ secrets.PLATFORM_TOKEN }}
      semgrep_app_token: ${{ secrets.SEMGREP_APP_TOKEN }}

  lesson-check:
    name: OpenBrain Lesson Check
    needs: resolve-platform
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Always checked out at the resolved SHA, never restored from actions/cache:
      # a cache entry could be poisoned by PR code and its scripts run with secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AlbertvD/homelab-platform
          ref: ${{ needs.resolve-platform.outputs.platform_sha }}
          path: .platform
          token: ${{ secrets.PLATFORM_TOKEN }}
          persist-credentials: false
      - name: Query OpenBrain for relevant lessons
        env:
          OPENBRAIN_URL: ${{ vars.OPENBRAIN_URL }}
          OPENBRAIN_KEY: ${{ secrets.OPENBRAIN_KEY }}
        run: bash .platform/evals/lesson-check.sh

  capture-failure:
    name: Capture Failure to OpenBrain
    if: failure()
    needs: [resolve-platform, destructive-check, compose-validate, gitleaks, semgrep, lesson-check]
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Always checked out at the resolved SHA, never restored from actions/cache:
      # a cache entry could be poisoned by PR code and its scripts run with secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AlbertvD/homelab-platform
          ref: ${{ needs.resolve-platform.outputs.platform_sha }}
          path: .platform
          token: ${{ secrets.PLATFORM_TOKEN }}
          persist-credentials: false
      - name: Capture failure lesson
        env:
          OPENBRAIN_URL: ${{ vars.OPENBRAIN_URL }}
          OPENBRAIN_KEY: ${{ secrets.OPENBRAIN_KEY }}
        run: |
          bash .platform/evals/lesson-capture.sh \
            "ci-pipeline" "ci" "friction" \
            "Safety eval failed for ${{ github.repository }} on branch ${{ github.ref_name }}"
